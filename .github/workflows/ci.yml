name: Football checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type contracts
        run: npm run typecheck
      - name: Football and room rules
        run: npm test
      - name: Client and server production build
        run: npm run build
      - name: Real WebSocket clients against the built server
        run: npm run test:integration
